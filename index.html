    <script type="text/javascript">
      // First-visit root redirect. Runs only on the exact root path "/".
      // Any other URL is authoritative — including /en/*, /preise, etc.
      // navigator.language is the only signal; no localStorage read, no cookie.
      //   "de*"      → stay on /
      //   "en*"      → redirect to /en/
      //   anything   → stay on / (German default)
      (function () {
        if (window.location.pathname !== '/') return;
        var lang = (navigator.language || '').toLowerCase();
        if (lang.indexOf('en') === 0) {
          window.location.replace('/en' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="text/javascript">
      // SPA fallback decoder: reads ?/path from 404.html redirect and rewrites history.
      (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}}(window.location));
    </script>
