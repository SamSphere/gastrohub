    <script type="text/javascript">
      // First-visit root redirect. Runs only on the exact root path "/".
      // Skipped once the user has explicitly picked a language via the toggle
      // (gh:lang in localStorage) — otherwise an English-browser user clicking
      // "DE" on /en would land on / and get bounced right back to /en.
      //   no stored pick + "en*" → redirect to /en/
      //   no stored pick + "ar*" → redirect to /ar/
      //   otherwise              → stay on / (German default)
      (function () {
        if (window.location.pathname !== '/') return;
        try { if (localStorage.getItem('gh:lang')) return; } catch (e) {}
        var lang = (navigator.language || '').toLowerCase();
        var tail = window.location.search + window.location.hash;
        if (lang.indexOf('en') === 0) {
          window.location.replace('/en' + tail);
        } else if (lang.indexOf('ar') === 0) {
          window.location.replace('/ar' + tail);
        }
      })();
    </script>
    <script type="text/javascript">
      // SPA fallback decoder: reads ?/path from 404.html redirect and rewrites history.
      (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash)}}(window.location));
    </script>
